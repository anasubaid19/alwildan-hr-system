services:
  postgres:
    image: postgres:16-alpine
    container_name: alwildan_postgres
    environment:
      POSTGRES_DB: alwildan_hr
      POSTGRES_USER: alwildan
      POSTGRES_PASSWORD: alwildan2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

