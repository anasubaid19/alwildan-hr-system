services:
  postgres:
    image: postgres:16-alpine
    container_name: alwildan_postgres
    environment:
      POSTGRES_DB: alwildan_hr
      POSTGRES_USER: alwildan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alwildan2026}
    ports:
      # Loopback saja: DB gaji tidak boleh terjangkau dari LAN/internet.
      # App mengakses postgres via jaringan internal compose, bukan port host.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alwildan -d alwildan_hr"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alwildan_app
    ports:
      # Port host configurable via .env — default 3100 (port dedicated web,
      # sama dgn dev vite). BETTER_AUTH_URL harus memakai port yang sama.
      - "${APP_PORT:-3100}:3000"
    environment:
      # Password ikut POSTGRES_PASSWORD (atau override DATABASE_URL penuh).
      # Nama var interpolasi sengaja APP_DATABASE_URL (bukan DATABASE_URL):
      # .env dev berisi DATABASE_URL=@localhost utk `bun run dev` — bila dipakai
      # di sini, nilai itu bocor ke container dan app crash (postgres ada di
      # container lain, bukan localhost).
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql://alwildan:${POSTGRES_PASSWORD:-alwildan2026}@postgres:5432/alwildan_hr}
      # WAJIB diisi (via file .env di samping compose): openssl rand -base64 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
      # Email reset password (opsional di dev — tanpa key, link dicetak ke log)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
