version: '3.8'

services:
  backend:
    build: ./backend
    container_name: alwildan-hr-backend
    restart: unless-stopped
    # Port backend tidak diekspos keluar — hanya diakses internal via nginx
    volumes:
      - ./data:/app/data          # database SQLite
      - ./backend/uploads:/app/uploads  # file upload Excel
    env_file:
      - .env                      # baca JWT_SECRET, AI_BASE_URL, dll dari .env
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DB_PATH=/app/data/alwildan.db
    networks:
      - alwildan-network

  frontend:
    build: ./frontend
    container_name: alwildan-hr-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:80"                   # akses via http://server-ip
    depends_on:
      - backend
    networks:
      - alwildan-network

networks:
  alwildan-network:
    driver: bridge
